# Local development stack: Vault (dev mode) + PostgreSQL + FastAPI demo app.
# Start everything:  docker compose up -d
# Check app health:   curl http://localhost:8000/health
# Check Vault status: docker exec vault vault status

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      # Dev mode auto-unseals Vault and creates a root token — local testing only.
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - zero-trust-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: vaultadmin
      POSTGRES_PASSWORD: vaultadmin
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultadmin -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - zero-trust-net

  # One-shot bootstrap: policies, AppRole, database secrets engine.
  vault-init:
    image: hashicorp/vault:1.17
    container_name: vault-init
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
      BOOTSTRAP_DIR: /bootstrap
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: appdb
      PG_ADMIN_USER: vaultadmin
      PG_ADMIN_PASSWORD: vaultadmin
    volumes:
      - ./vault-config:/vault-config:ro
      - vault-bootstrap:/bootstrap
    entrypoint: ["/bin/sh", "/vault-config/scripts/init-dev.sh"]
    restart: "no"
    networks:
      - zero-trust-net

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app
    ports:
      - "8000:8000"
    environment:
      APP_NAME: zero-trust-demo
      VAULT_ADDR: http://vault:8200
    depends_on:
      vault-init:
        condition: service_completed_successfully
    volumes:
      - vault-bootstrap:/bootstrap:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zero-trust-net

networks:
  zero-trust-net:
    driver: bridge

volumes:
  postgres-data:
  vault-bootstrap:
