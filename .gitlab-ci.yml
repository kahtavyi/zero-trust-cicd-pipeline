# GitLab CI/CD DevSecOps pipeline for the Ajax Systems model web application.
#
# Stages (Security Quality Gates):
#   1. secret-scan    — blocks commits containing secrets (Gitleaks v8.24.2)
#   2. lint           — enforces Python code style & formatting (Ruff 0.12.11)
#   3. sast           — static application security testing (Semgrep 1.102.0)
#   4. test           — runs the automated test suite (Pytest 9.1.1)
#   5. container-scan — builds Docker image & scans image/deps/IaC (Trivy 0.58.1)
#   6. dast           — dynamic application security testing (OWASP ZAP Baseline)
#   7. aws-verify     — validates passwordless AWS auth via OIDC (id_tokens)

stages:
  - secret-scan
  - lint
  - sast
  - test
  - container-scan
  - dynamic-scan
  - aws-verify

variables:
  GIT_DEPTH: "0"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  AWS_REGION: "us-east-1"
  APP_IMAGE: "zero-trust-cicd-pipeline-app:${CI_COMMIT_SHORT_SHA}"

# =============================================================================
# Stage 1: Secret Scan (Gitleaks)
# =============================================================================
secret_scan:
  stage: secret-scan
  image:
    name: zricethezav/gitleaks:v8.24.2
    entrypoint: [""]
  script:
    - gitleaks git --redact --verbose --report-format json --report-path gitleaks-report.json
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 7 days

# =============================================================================
# Stage 2: Lint & Format Check (Ruff)
# =============================================================================
lint:
  stage: lint
  image:
    name: ghcr.io/astral-sh/ruff:0.12.11-alpine
    entrypoint: [""]
  script:
    - ruff check app
    - ruff format --check app

# =============================================================================
# Stage 3: Static Application Security Testing — SAST (Semgrep)
# =============================================================================
sast_semgrep:
  stage: sast
  image:
    name: semgrep/semgrep:1.102.0
    entrypoint: [""]
  script:
    - semgrep scan --config p/python --config p/owasp-top-ten --error --json --output semgrep-report.json app
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 7 days

# =============================================================================
# Stage 4: Unit & Integration Tests (Pytest)
# =============================================================================
test:
  stage: test
  image: python:3.12-slim
  cache:
    key: "python-3.12"
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --cache-dir "$PIP_CACHE_DIR" -r app/requirements.txt
  script:
    - cd app
    - pytest tests/ -v --junitxml=../pytest-report.xml
  artifacts:
    when: always
    paths:
      - pytest-report.xml
    reports:
      junit: pytest-report.xml
    expire_in: 7 days

# =============================================================================
# Stage 5: Container Build, SCA & IaC Scan (Docker DinD + Trivy)
# =============================================================================
container_build:
  stage: container-scan
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - |
      for i in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          break
        fi
        sleep 1
      done
    - docker build -t "$APP_IMAGE" ./app
    - docker save "$APP_IMAGE" -o app-image.tar
    - ls -lh app-image.tar
  artifacts:
    paths:
      - app-image.tar
    expire_in: 1 hour

container_trivy:
  stage: container-scan
  needs:
    - container_build
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/trivy"
  cache:
    key: "trivy-db-v2"
    paths:
      - .cache/trivy
  script:
    - trivy image --skip-check-update --ignore-unfixed --severity HIGH,CRITICAL --format json --output trivy-image-report.json --input app-image.tar
    - trivy image --skip-check-update --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --input app-image.tar
    - rm -f app-image.tar
    - trivy config --skip-check-update --skip-dirs .cache --severity HIGH,CRITICAL --format json --output trivy-iac-report.json .
    - trivy config --skip-check-update --skip-dirs .cache --severity HIGH,CRITICAL --exit-code 1 .
  artifacts:
    when: always
    paths:
      - trivy-image-report.json
      - trivy-iac-report.json
    expire_in: 7 days

# =============================================================================
# Stage 6: Dynamic Application Security Testing — DAST (OWASP ZAP Baseline)
# =============================================================================
dast_zap:
  stage: dynamic-scan
  needs:
    - job: container_build
      artifacts: true
    - job: container_trivy
      artifacts: false
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - |
      for i in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          break
        fi
        sleep 1
      done
    - cp -n app/.env.example .env || true
    - docker load -i app-image.tar
    - docker compose --profile dev up -d --no-build
    - |
      for i in $(seq 1 30); do
        if docker compose --profile dev exec -T app python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')" >/dev/null 2>&1; then
          echo "Target application is healthy and connected to PostgreSQL via Vault dynamic credentials."
          break
        fi
        if [ "$i" -eq 30 ]; then
          echo "ERROR: Target application failed to become ready."
          docker compose --profile dev ps
          docker compose --profile dev logs --tail=100
          exit 1
        fi
        sleep 2
      done
    - docker compose --profile dev ps
    - docker compose --profile dev exec -T app python -c "import urllib.request; print('/health:', urllib.request.urlopen('http://127.0.0.1:8000/health').read().decode()); print('/ready:', urllib.request.urlopen('http://127.0.0.1:8000/ready').read().decode()); print('/api/v1/devices:', urllib.request.urlopen('http://127.0.0.1:8000/api/v1/devices').read().decode())"
    - |
      COMPOSE_NET=$(docker inspect app --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')
      echo "Running OWASP ZAP Baseline against http://app:8000 on network ${COMPOSE_NET}"
      set +e
      docker run --name zap-scan --network "${COMPOSE_NET}" \
        ghcr.io/zaproxy/zaproxy:stable \
        sh -c "mkdir -p /zap/wrk && /zap/zap-baseline.py -t http://app:8000 -z '-silent' -J zap-report.json -r zap-report.html"
      ZAP_RC=$?
      set -e
      docker cp zap-scan:/zap/wrk/zap-report.json ./zap-report.json || true
      docker cp zap-scan:/zap/wrk/zap-report.html ./zap-report.html || true
      docker rm -f zap-scan || true
      docker compose --profile dev down -v || true
      echo "OWASP ZAP exit code: ${ZAP_RC}"
      exit "${ZAP_RC}"
  artifacts:
    when: always
    paths:
      - zap-report.json
      - zap-report.html
    expire_in: 7 days

# =============================================================================
# Stage 7: AWS OIDC Verify — passwordless authentication
# =============================================================================
aws_oidc_verify:
  stage: aws-verify
  image:
    name: amazon/aws-cli:2.22.0
    entrypoint: [""]
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: "https://gitlab.com"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never
  script:
    - |
      if [ -z "${AWS_ROLE_ARN}" ]; then
        echo "ERROR: AWS_ROLE_ARN is not set. Add it as a protected CI/CD variable."
        exit 1
      fi
      if [ -z "${AWS_REGION}" ]; then
        echo "ERROR: AWS_REGION is not set."
        exit 1
      fi
      echo "AWS_ROLE_ARN : ${AWS_ROLE_ARN}"
      echo "AWS_REGION   : ${AWS_REGION}"
    - echo "${AWS_OIDC_TOKEN}" > /tmp/oidc-token.jwt
    - chmod 600 /tmp/oidc-token.jwt
    - |
      CREDS=$(aws sts assume-role-with-web-identity \
        --role-arn "${AWS_ROLE_ARN}" \
        --role-session-name "gitlab-ci-${CI_JOB_ID}" \
        --web-identity-token file:///tmp/oidc-token.jwt \
        --duration-seconds 3600 \
        --region "${AWS_REGION}" \
        --query '[Credentials.AccessKeyId, Credentials.SecretAccessKey, Credentials.SessionToken, Credentials.Expiration]' \
        --output text)
    - |
      export AWS_ACCESS_KEY_ID=$(echo "${CREDS}"     | awk '{print $1}')
      export AWS_SECRET_ACCESS_KEY=$(echo "${CREDS}" | awk '{print $2}')
      export AWS_SESSION_TOKEN=$(echo "${CREDS}"     | awk '{print $3}')
      EXPIRATION=$(echo "${CREDS}"                   | awk '{print $4}')
      echo "Temporary credentials obtained. Valid until: ${EXPIRATION}"
    - aws sts get-caller-identity --region "${AWS_REGION}"
    - echo "OIDC authentication successful — no static AWS keys were used."
    - rm -f /tmp/oidc-token.jwt
