# GitLab CI pipeline for the Zero-Trust demo.
# It runs on every branch push and merge request. Deployment and AWS OIDC will
# be added later, after the GitLab project and AWS IAM role are configured.

stages:
  - secret-scan
  - lint
  - test
  - integration

variables:
  # A full clone lets gitleaks scan the repository history, not only the last commit.
  GIT_DEPTH: "0"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "python-3.12"
  paths:
    - .cache/pip

secret_scan:
  stage: secret-scan
  image:
    name: zricethezav/gitleaks:v8.24.2
    entrypoint: [""]
  script:
    # --redact prevents a detected secret from being printed in the job log.
    - gitleaks git --redact --verbose

lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - python -m pip install --no-cache-dir ruff==0.12.11
  script:
    - ruff check app
    - ruff format --check app

test:
  stage: test
  image: python:3.12-slim
  before_script:
    - python -m pip install --cache-dir "$PIP_CACHE_DIR" -r app/requirements.txt
  script:
    - cd app
    - pytest tests/ -v

integration:
  stage: integration
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache py3-pip bash curl
    - pip install docker-compose
    - docker info
    - docker compose version || true
  script:
    - docker compose --profile dev build
    - ./scripts/docker-check.sh
  privileged: true
  timeout: 30m
  artifacts:
    when: always
    expire_in: 1 day
    paths: []
  when: on_success
  allow_failure: false
